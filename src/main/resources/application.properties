spring.application.name=fiscontrolbackend-v3

#Main Database configuration (para SupplyEntity, BatchEntity, etc.)
spring.datasource.url=jdbc:postgresql://localhost:5432/fishcontrol_dbv3
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

#Second Database configuration (para UserEntity y RoleEntity)
spring.second-datasource.url=jdbc:postgresql://localhost:5432/fiscontrol_users_db
spring.second-datasource.username=postgres
spring.second-datasource.password=password
spring.second-datasource.driver-class-name=org.postgresql.Driver

#JWT
jwt.secret.

jwt.time.expiration=3600000

